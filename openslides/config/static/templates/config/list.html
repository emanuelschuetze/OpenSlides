<h1 translate>Settings</h1>

<div class="panel-group" id="accordion" role="tablist" aria-multiselectable="true">
  <!-- generate config groups -->
  <div ng-repeat="group in config_groups">
    <div class="panel panel-default">
      <div class="panel-heading" role="tab" id="heading{group.name}}{">
        <h4 class="panel-title">
          <a data-toggle="collapse" data-parent="#accordion" href="#{{group.name}}"
              aria-expanded="false" aria-controls="{{group.name}}" translate>
            {{ group.name }}
          </a>
        </h4>
      </div>
      <div id="{{group.name}}" class="panel-collapse collapse" role="tabpanel" aria-labelledby="heading{{group.name}}">
        <div class="panel-body">
          <div ng-repeat="subgroup in group.subgroups">
            <h3>{{ subgroup.name }}</h3>
            <div ng-repeat="config in subgroup.items">
              <div class="form-group">
                <label>{{ config.label }}</label>
                <div class="input-group">
                  <input ng-model="config.value" id="{{ config.key }}" type="config.input_type"
                      class="form-control">
                  <span class="input-group-btn">
                    <button ng-click="config.value = '1'" class="btn btn-default" translate>
                      <i class="fa fa-undo"></i>
                      <translate>Reset</translate>{{config.default_value}}
                    </button>
                  </span>
                </div>
                <p ng-if="config.help_text" class="help-block">{{ config.help_text }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
